name: CI

# Each change is tested once, on its pull request. The weekly run surfaces drift
# in the registry. The lint ratchet's integration suite has its own workflow,
# lint-tooling-ci.yml, because it tests the lint tooling itself.
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The Hyperion compile and native semantic gates (npm run compile and
# npm run test:semantic), the compiler half of the contract lint gate
# (npm run lint:contracts), the stateful fuzzer (npm run fuzz and
# npm run fuzz:long), the formal proof gate (npm run verify:formal, needs a
# Z3-enabled hypc build), and the live behavior suite (npm run test:behavior,
# needs a deployed local Kurtosis stack) run locally: hosted runners have no
# hypc distribution yet. CI covers everything runnable on a stock runner,
# including the contract source policy and the fuzz model unit tests.

jobs:
  scripts:
    name: Deployment scripts (node:test)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sdk/package-lock.json

      - name: Install
        run: npm ci

      - name: Install SDK for script hashing and ABI tests
        run: npm --prefix sdk ci

      - name: Script tests
        run: npm run test:scripts

      - name: Contract source policy
        run: npm run lint:contracts:source

      - name: Behavior suite skip path
        run: node --test test/behavior/*.test.js

  sdk:
    name: SDK (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdk/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint through the ratchet
        env:
          LINT_RATCHET_BASE: ${{ github.event.pull_request.base.sha || 'HEAD' }}
        run: npm run lint:ratchet -- --base-ref "$LINT_RATCHET_BASE"

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
        if: ${{ hashFiles('sdk/src/**/*.test.ts') != '' }}

  app:
    name: Registration app
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            sdk/package-lock.json
            app/package-lock.json

      - name: Install and build SDK
        run: npm --prefix sdk ci && npm --prefix sdk run build

      - name: Install app
        run: npm --prefix app ci

      - name: Format
        run: npm --prefix app run format:check

      - name: Lint through the ratchet
        env:
          LINT_RATCHET_BASE: ${{ github.event.pull_request.base.sha || 'HEAD' }}
        run: npm --prefix app run lint:ratchet -- --base-ref "$LINT_RATCHET_BASE"

      - name: Typecheck
        run: npm --prefix app run typecheck

      - name: Test
        run: npm --prefix app test

      - name: Build
        run: npm --prefix app run build
