name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The Hyperion compile and native semantic gates (npm run compile and
# npm run test:semantic), the compiler half of the contract lint gate
# (npm run lint:contracts), the stateful fuzzer (npm run fuzz and
# npm run fuzz:long), the formal proof gate (npm run verify:formal, needs a
# Z3-enabled hypc build), and the live behavior suite (npm run test:behavior,
# needs a deployed local Kurtosis stack) run locally: hosted runners have no
# hypc distribution yet. CI covers everything runnable on a stock runner,
# including the contract source policy and the fuzz model unit tests.

jobs:
  scripts:
    name: Deployment scripts (node:test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Script tests
        run: npm run test:scripts

      - name: Contract source policy
        run: npm run lint:contracts:source

      - name: Behavior suite skip path
        run: node --test test/behavior/*.test.js

  sdk:
    name: SDK (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sdk/package-lock.json

      - name: Install
        run: nice -n 10 npm ci

      - name: Lint
        run: npm run lint

      - name: Lint ratchet
        env:
          LINT_RATCHET_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run lint:ratchet -- --base-ref "$LINT_RATCHET_BASE"

      - name: Ratchet integration tests
        env:
          LINT_RATCHET_TEST_PACKAGE: sdk
        run: node --test ../test/lint-ratchet/integration.test.js

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
        if: ${{ hashFiles('sdk/src/**/*.test.ts') != '' }}

  app:
    name: Registration app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            sdk/package-lock.json
            app/package-lock.json

      - name: Install and build SDK
        run: nice -n 10 npm --prefix sdk ci && nice -n 10 npm --prefix sdk run build

      - name: Install app
        run: nice -n 10 npm --prefix app ci

      - name: Format
        run: nice -n 10 npm --prefix app run format:check

      - name: Lint
        run: nice -n 10 npm --prefix app run lint

      - name: Lint ratchet
        env:
          LINT_RATCHET_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: nice -n 10 npm --prefix app run lint:ratchet -- --base-ref "$LINT_RATCHET_BASE"

      - name: Ratchet integration tests
        env:
          LINT_RATCHET_TEST_PACKAGE: app
        run: nice -n 10 node --test test/lint-ratchet/integration.test.js

      - name: Typecheck
        run: nice -n 10 npm --prefix app run typecheck

      - name: Test
        run: nice -n 10 npm --prefix app test

      - name: Build
        run: nice -n 10 npm --prefix app run build
