name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The Hyperion compile gate (npm run compile), the formal proof gate
# (npm run verify:formal, needs a Z3-enabled hypc build), and the live
# behavior suite (npm run test:behavior, needs a deployed local Kurtosis
# stack) run locally: hosted runners have no hypc distribution yet. CI
# covers everything runnable on a stock runner.

jobs:
  scripts:
    name: Deployment scripts (node:test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Script tests
        run: npm run test:scripts

      - name: Behavior suite skip path
        run: node --test test/behavior/*.test.js

  sdk:
    name: SDK (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sdk/package-lock.json

      - name: Install
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
        if: ${{ hashFiles('sdk/src/**/*.test.ts') != '' }}
