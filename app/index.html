<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e6f5fd" />
    <link
      rel="icon"
      type="image/png"
      href="https://myqrlwallet.com/img/favicon-96x96.png"
      sizes="96x96"
    />
    <link rel="icon" type="image/svg+xml" href="https://myqrlwallet.com/img/favicon.svg" />
    <link rel="shortcut icon" href="https://myqrlwallet.com/img/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="https://myqrlwallet.com/img/apple-touch-icon.png"
    />
    <link rel="manifest" href="https://myqrlwallet.com/img/site.webmanifest" />
    <meta
      name="description"
      content="Give your QRL 2.0 address a readable .qrl name. Search a name, register it from your wallet, and use it in MyQRLWallet and on the block explorer."
    />
    <title>QRL Name Service (QNS): claim your .qrl name | MyQRLWallet</title>
    <!-- myqrlwallet.com/names/ is the app's one public home. The icons and the
         card below are the landing site's own files, named in full so the build
         leaves them alone. A build for another host has to change these. -->
    <link rel="canonical" href="https://myqrlwallet.com/names/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MyQRLWallet" />
    <meta property="og:url" content="https://myqrlwallet.com/names/" />
    <meta property="og:title" content="QRL Name Service: your name on QRL" />
    <meta property="og:description" content="Find and claim your .qrl name on QRL 2.0." />
    <meta property="og:image" content="https://myqrlwallet.com/img/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@myqrlwallet" />
    <meta name="twitter:title" content="QRL Name Service: your name on QRL" />
    <meta name="twitter:description" content="Find and claim your .qrl name on QRL 2.0." />
    <meta name="twitter:image" content="https://myqrlwallet.com/img/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
